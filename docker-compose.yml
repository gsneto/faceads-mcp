  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     PORT: 3000
  #     DATABASE_URL: postgresql://mcp:mcp_dev_2026@postgres:5432/fb_marketing_mcp
  #     TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
  #     MCP_BASE_URL: ${MCP_BASE_URL:-http://localhost:3000}

volumes:
  pgdata:
