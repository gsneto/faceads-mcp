services:
  postgres:
    image: postgres:16-alpine
    container_name: fb-mcp-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp_dev_2026
      POSTGRES_DB: fb_marketing_mcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d fb_marketing_mcp"]
      interval: 5s
      timeout: 3s
      retries: 5

  # mcp:
  #   build: .
  #   container_name: fb-mcp-server
